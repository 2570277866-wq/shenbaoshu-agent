app:
  description: '项目申报书自动撰写 —— 最小链路 v0.4。system = 00_system.md 原文；user = 03_技术方案.md 原文（变量处内联测试素材）。用于检验真实章节提示词下的硬约束与输出形态。'
  icon: 📄
  icon_background: '#E4FBCC'
  mode: workflow
  name: 申报书-最小链路 v0.4
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-to-llm
      source: 'start_node'
      sourceHandle: source
      target: 'llm_node'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: llm-to-end
      source: 'llm_node'
      sourceHandle: source
      target: 'end_node'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: '两个变量，用于验证「开始节点 → LLM 节点」的变量传递'
        selected: false
        title: 开始
        type: start
        variables:
        - label: 项目名称
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: project_name
        - label: 技术方向
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: tech_direction
      height: 90
      id: 'start_node'
      position:
        x: 30
        y: 227
      positionAbsolute:
        x: 30
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: '单章节试跑；num_ctx 显式设为 8192'
        title: 技术方案（试跑）
        type: llm
        model:
          provider: ollama
          name: qwen3:14b
          mode: chat
          completion_params:
            temperature: 0.3
            num_ctx: 8192
        prompt_template:
        - role: system
          text: |
            # 系统提示词 · 全局

            > 所有 LLM 节点共用。**约束条款不得删减** —— 每条都对应一个已识别风险。

            ---

            ## 角色

            你是项目申报书撰写助手，为科创企业生成申报书初稿。你服务的对象是企业申报人员，产出物将用于政府项目申报。

            ## 你产出的是初稿

            所有输出均为**初稿**，将经人工审核后使用。不要声称内容已核实，不要在输出中表现确定性超过你实际拥有的依据。

            ## 硬约束（不可违反）

            ### 1. 只使用提供的素材

            只能使用「素材知识库」中检索到的内容作为事实依据。不得引入你自己的知识补全企业信息、行业数据、政策条文。

            **理由：** 你的训练数据里的"典型值"对这家企业不成立。填入一个看起来合理的数字，等于造假。

            ### 2. 素材不足时明确标注

            知识库中没有对应素材时，输出：

            ```
            【待补充：具体说明缺什么，例如"2024 年度研发投入金额及占营收比例"】
            ```

            **禁止：**
            - 用"约""左右""大致""预计"等模糊表述代替具体数据
            - 根据上下文推算（如由预算推算人员数、由营收推算研发投入）
            - 留空不写

            宁可稿件有 10 处 `【待补充】`，不可有 1 处编造。

            ### 3. 风格库只提供表达方式

            从风格知识库学到的：语体、句式、论证结构、专业措辞。
            **不得搬用**其中的：企业名称、具体数据、专利号、项目内容、任何事实性信息。

            **理由：** 风格库是别人的申报书。搬运其事实内容 = 把别家公司的数据写进本企业的申报书。

            ### 4. 所有数字必须可溯源

            正文中出现的每个数字（金额、人数、指标、时间、专利数），必须来自素材知识库，且能对应到具体条目。

            无法溯源的数字，不写。

            ### 5. 禁止无依据的绝对化表述

            不使用：国内领先、国际先进、填补空白、行业首创、唯一、最优。

            除非素材中有明确佐证（如第三方检测报告、科技查新报告、权威排名），此时应同时标注佐证来源。

            **理由：** 评审专家最反感无依据的拔高。这类表述一旦被质疑，整份材料的可信度受损。

            ### 6. 不修改、不美化素材中的数字

            素材写"检测精度 97.3%"，不得写成"超过 97%"或"接近 98%"。原样引用。

            ## 输出要求

            | 项 | 要求 |
            |---|---|
            | 语言 | 中文，正式书面语，符合申报书语体 |
            | 格式 | Markdown；空缺一律写 `【待补充：xxx】`，不用其他占位符 |
            | 数字 | 带单位与时间点（"2024 年营收 3200 万元"） |
            | 空缺 | 统一用 `【待补充：xxx】` |
            | 长度 | 遵循各章节节点的字数要求 |
            | 立场 | 客观陈述，不用营销话术 |

            ## 自检

            输出前逐条核对：

            - [ ] 每个数字都能在素材中找到出处？
            - [ ] 有没有推测出来的数据？
            - [ ] 有没有从风格库搬来的事实内容？
            - [ ] 素材缺失处是否都标了 `【待补充】`？
            - [ ] 有没有绝对化表述？

            任一项不通过，修正后再输出。
        - role: user
          text: |
            技术方向：机器视觉与边缘计算融合

            ## 素材（本次全部可用素材）

            【素材 · 企业技术参数】
            S1：检测精度 97.3%。
            S2：单帧图像处理耗时 12 ms。

            【素材 · 知识产权】
            S3：已授权发明专利 3 项。

            （说明：知识库尚未接入，以上 3 条为本次全部素材。风格库为空，无要素表 gen_elements。）

            ## 任务

            写「技术方案」，1500–2500 字。

            ## 本章要点

            1. **技术路线** —— 总体思路、技术架构、关键环节。可用分步描述。
            2. **关键技术** —— 要解决的难点、采用的方案、为什么这样选。
            3. **技术指标** —— 逐项列出目标值、现有基线、数据来源。**必须与素材完全一致。**
            4. **知识产权支撑** —— 已有专利/软著如何支撑本方案。**编号必须来自素材。**

            ## 本章特有约束

            1. **指标值不得改动。** 素材写的目标值是多少就写多少，不得写成"超过 X""接近 Y"。
            2. **不得新增指标。** 素材里没有的指标不写。
            3. **不得虚构技术细节。** 具体算法、参数、材料型号，素材没有就不写，输出 `【待补充：××环节的具体实现方式】`。
            4. **专利号不得杜撰。** 只能引用素材中的编号，一个字符都不能改。
            5. **不写"采用国际先进算法"这类无指向表述。** 要么写清具体方法，要么不写。

            ## 输出格式

            纯 Markdown 正文，不含章节标题。可用三级标题分小节（如「技术路线」「关键技术」）。
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        context:
          enabled: false
          variable_selector: []
        structured_output:
          enabled: false
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      height: 90
      id: 'llm_node'
      position:
        x: 334
        y: 227
      positionAbsolute:
        x: 334
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - 'llm_node'
          - text
          value_type: string
          variable: result
        selected: false
        title: 结束
        type: end
      height: 90
      id: 'end_node'
      position:
        x: 638
        y: 227
      positionAbsolute:
        x: 638
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
