            # 章节 · 技术方案

            > 本章是申报书的**评分重心**，也是幻觉风险最高的章节。数字密度最大，务必逐项回溯。

            ## 任务

            写「技术方案」，**不超过 2500 字**。

            > 篇幅规则见 `00_system.md`「篇幅」——**素材不足时允许远低于上限**。
            > 本节的目的是**如实呈现已有素材**，不是把篇幅填满。

            ## 本章要点

            1. **技术路线** —— 总体思路、技术架构、关键环节。可用分步描述。
            2. **关键技术** —— 要解决的难点、采用的方案、为什么这样选。
            3. **技术指标** —— **只列素材中已存在的指标**，逐项给出目标值、现有基线、数据来源。
               **素材没有的指标，连指标名都不要出现** —— 不要写「XX 指标：【待补充】」这种空壳。
               那等于替企业凭空立了个指标，验收时要兑现。
               **必须与 `gen_elements.core_metrics` 完全一致。**
            4. **知识产权支撑** —— 已有专利/软著如何支撑本方案。**编号必须来自 `gen_elements.ip_list`。**

            ## 本章特有约束 ★

            1. **指标值不得改动。** `gen_elements` 写的目标值是多少就写多少，不得写成"超过 X""接近 Y"。
            2. **不得新增指标。** 素材里没有的指标不写。评审看指标，编一个指标等于给自己挖坑 —— 验收时要兑现。
            3. **不得虚构技术细节。** 具体算法、参数、材料型号，素材没有就不写，输出 `【待补充：××环节的具体实现方式】`。
            4. **专利号不得杜撰。** 只能引用 `ip_list` 中的编号，一个字符都不能改。
            5. **不写"采用国际先进算法"这类无指向表述。** 要么写清具体方法，要么不写。

            > 数字来源标记、不得声称佐证、`【待补充】` 方括号格式 —— 这三条**已上提为全局约束**
            > （`00_system.md` 硬约束 7/8 与输出要求），本章不再重复。

            ## 输出格式

            纯 Markdown 正文，**直接写正文**。可用**三级**标题分小节（如 `### 技术路线`）。

            > 章节标题、`【待补充：xxx】` 方括号等通用格式要求见 `00_system.md` 输出要求。

            ## 自检

            - [ ] 每个指标值与 `gen_elements` 一致？
            - [ ] 每个专利号在 `ip_list` 中？
            - [ ] 有没有素材中不存在的技术细节？
            - [ ] 有没有绝对化表述？
