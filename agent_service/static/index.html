<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目申报书自动撰写</title>
<style>
  :root { --line: #e3e6ea; --main: #1a5fb4; --warn-bg: #fff8e6; --block-bg: #fdecec; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f6f7f9; color: #222; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 6px 0 0; color: #666; font-size: 13px; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  form { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; }
  .req { color: #c0392b; }
  input, textarea, select { width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid #ccd2d9; border-radius: 6px; font-family: inherit; }
  textarea { min-height: 72px; resize: vertical; }
  .hint { color: #888; font-size: 12px; margin-top: 4px; }
  button { background: var(--main); color: #fff; border: 0; border-radius: 6px;
    padding: 10px 28px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #9db8d8; cursor: wait; }
  #msg { margin-top: 12px; font-size: 14px; }
  #msg.error { color: #c0392b; }
  section { margin: 20px 0; border-top: 1px dashed var(--line); padding-top: 14px; }
  section h2 { font-size: 15px; margin: 0 0 12px; color: #444; }
</style>
</head>
<body>
<header>
  <h1>项目申报书自动撰写</h1>
  <p>AI 出初稿，人工做最终审核。素材不足处会标注【待补充】，须人工补全后使用。</p>
</header>
<main>
  <div id="profile_pick" style="margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 24px;font-size:14px;"></div>
  <form id="f" onsubmit="return submitForm(event)">
    <p id="loadmsg">正在加载表单…</p>
  </form>
  <div id="msg"></div>
</main>
<script>
const TOKEN_KEY = "agent_token";
const PROFILE_KEY = "agent_profile";
let profile = localStorage.getItem(PROFILE_KEY) || "enterprise";
let fields = [];

function token() { return localStorage.getItem(TOKEN_KEY) || ""; }

async function api(url, opts = {}, retry = true) {
  const headers = Object.assign({}, opts.headers || {});
  if (token()) headers["X-Agent-Token"] = token();
  const resp = await fetch(url, Object.assign({}, opts, { headers }));
  if (resp.status === 401 && retry) {
    const t = prompt("此服务需要访问令牌（AGENT_SERVICE_TOKEN）。请输入：");
    if (t === null) throw new Error("未提供令牌");
    localStorage.setItem(TOKEN_KEY, t.trim());
    return api(url, opts, false);
  }
  if (!resp.ok) {
    let detail = resp.status;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp.json();
}

const TYPE = {
  "text-input": "input", "number": "input", "paragraph": "textarea", "select": "select",
};

function buildField(f) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.innerHTML = f.label + (f.required ? ' <span class="req">*</span>' : "");
  wrap.appendChild(label);
  const el = document.createElement(TYPE[f.type] || "input");
  el.name = f.var; el.id = "f_" + f.var;
  if (f.max_length) el.maxLength = f.max_length;
  if (f.required) el.required = true;
  if (f.type === "number") { el.type = "number"; el.min = "1"; }
  if (f.type === "select") {
    for (const opt of f.options || []) {
      const o = document.createElement("option");
      o.value = o.textContent = opt;
      el.appendChild(o);
    }
  }
  if (f.var.startsWith("material_")) el.placeholder = "一行一条";
  if (f.var === "style_input") el.placeholder = "只学表达，可留空";
  wrap.appendChild(el);
  return wrap;
}

function buildPicker(profiles) {
  const pick = document.getElementById("profile_pick");
  pick.innerHTML = "";
  const title = document.createElement("span");
  title.textContent = "申报对象：";
  pick.appendChild(title);
  for (const p of profiles) {
    const label = document.createElement("label");
    label.style.marginRight = "24px";
    label.style.cursor = "pointer";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "profile";
    radio.value = p.id;
    radio.checked = p.id === profile;
    radio.addEventListener("change", () => switchProfile(p.id));
    label.appendChild(radio);
    label.appendChild(document.createTextNode(p.label));
    pick.appendChild(label);
  }
}

function formHasInput() {
  const form = document.getElementById("f");
  for (const el of form.elements) {
    if (el.id === "paste_text") continue;
    if (typeof el.value === "string" && el.value.trim() !== "") return true;
  }
  return false;
}

async function switchProfile(id) {
  if (id === profile) return;
  if (formHasInput() &&
      !confirm("切换申报对象会清空已填内容，确定切换？")) {
    document.querySelector('input[name="profile"][value="' + profile + '"]').checked = true;
    return;
  }
  profile = id;
  localStorage.setItem(PROFILE_KEY, id);
  await loadForm();
}

async function loadForm() {
  const data = await api("/api/form?profile=" + encodeURIComponent(profile));
  fields = data.fields;
  buildPicker(data.profiles);
  const form = document.getElementById("f");
  form.innerHTML = "";
  let section = null;

  // 粘贴识别区：自由文本进，AI 抽成字段回填，人核对后提交。
  section = document.createElement("section");
  const pasteTitle = document.createElement("h2");
  pasteTitle.textContent = "粘贴识别（可选）";
  section.appendChild(pasteTitle);
  const pasteHint = document.createElement("div");
  pasteHint.className = "hint";
  pasteHint.textContent = "把项目简介、申报材料片段随手粘贴进来，点「粘贴识别」抽成表单字段回填。只识别文本里明确提到的，没提到就留空；识别结果必须逐项核对后提交。";
  section.appendChild(pasteHint);
  const pasteBox = document.createElement("textarea");
  pasteBox.id = "paste_text";
  pasteBox.rows = "5";
  pasteBox.placeholder = profile === "student"
    ? "示例：项目名称是…，项目负责人…，学院专业…，指导教师…，研究内容…"
    : "示例：项目名称是…，技术方向…，团队 12 人，预算 180 万到 220 万…";
  section.appendChild(pasteBox);
  const pasteBtnWrap = document.createElement("div");
  pasteBtnWrap.style.marginTop = "8px";
  const pasteBtn = document.createElement("button");
  pasteBtn.type = "button";
  pasteBtn.id = "parse_btn";
  pasteBtn.textContent = "粘贴识别";
  pasteBtn.addEventListener("click", parseFill);
  pasteBtnWrap.appendChild(pasteBtn);
  section.appendChild(pasteBtnWrap);
  form.appendChild(section);

  // 分组由后端 profile 配置出（title/vars/hint），前端不写死 material_ 前缀。
  const byVar = new Map(fields.map(f => [f.var, f]));
  const grouped = new Set();
  for (const group of data.groups || []) {
    section = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = group.title;
    section.appendChild(h);
    if (group.hint) {
      const d = document.createElement("div");
      d.className = "hint";
      d.textContent = group.hint;
      d.style.marginBottom = "12px";
      section.appendChild(d);
    }
    form.appendChild(section);
    for (const v of group.vars) {
      grouped.add(v);
      const f = byVar.get(v);
      if (f) section.appendChild(buildField(f));
    }
  }
  // 没进组的字段挂尾（后端约定）
  for (const f of fields) {
    if (!grouped.has(f.var)) form.appendChild(buildField(f));
  }
  const btn = document.createElement("button");
  btn.type = "submit";
  btn.id = "submit_btn";
  btn.textContent = "开始撰写（约 15–20 分钟）";
  form.appendChild(btn);
}

function setMsg(text, cls) {
  const msg = document.getElementById("msg");
  msg.className = cls || "";
  msg.textContent = text;
}

async function parseFill() {
  const box = document.getElementById("paste_text");
  const text = box.value.trim();
  if (!text) { setMsg("先粘贴一段项目信息文本再点识别。", "error"); return; }
  const btn = document.getElementById("parse_btn");
  btn.disabled = true;
  btn.textContent = "识别中…（约 1 分钟）";
  setMsg("");
  try {
    const data = await api("/api/parse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, profile: profile }),
    });
    if (data.error) {
      setMsg("识别失败：" + (data.parse_error || data.error) + " —— 表单可以照常手动填写。", "error");
      return;
    }
    let filled = 0;
    for (const f of fields) {
      const el = document.getElementById("f_" + f.var);
      const v = data.fields && data.fields[f.var];
      if (!el || v === undefined || v === null || v === "") continue;
      el.value = v;
      filled++;
    }
    const miss = (data.missing || []).join("、");
    setMsg("已识别回填 " + filled + " 个字段。未识别到：" + (miss || "无") + "。请逐项核对后再提交。");
  } catch (e) {
    setMsg("识别失败：" + e.message + " —— 表单可以照常手动填写。", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "粘贴识别";
  }
}

async function submitForm(event) {
  event.preventDefault();
  const form = event.target;
  const payload = {};
  for (const f of fields) {
    const el = form.elements[f.var];
    payload[f.var] = f.type === "number"
      ? parseInt(el.value || "0", 10)
      : (el.value || "").trim();
  }
  const btn = document.getElementById("submit_btn");
  btn.disabled = true;
  setMsg("任务已提交，正在跳转…");
  try {
    const data = await api("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: profile, fields: payload }),
    });
    location.href = data.url;
  } catch (e) {
    btn.disabled = false;
    setMsg("提交失败：" + e.message, "error");
  }
  return false;
}

loadForm().catch(e => {
  document.getElementById("loadmsg").textContent = "加载失败：" + e.message;
});
</script>
</body>
</html>
